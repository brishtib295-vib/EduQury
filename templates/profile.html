{% extends "base.html" %}{% block title %}Employee Profile · EduQuery{% endblock %}{% block content %}
<div class="card"><span class="pill">EMPLOYEE PROFILE</span><h1 class="page-title">Build your professional profile</h1><p class="page-sub">This information drives role-aware competency analysis and personalized learning recommendations.</p>
<form method="POST" style="margin-top:1.5rem"><div class="input-row"><div><label>Designation</label><input name="designation" value="{{ profile.designation if profile else '' }}" placeholder="Statistical Officer" required></div><div><label>Department</label><input name="department" value="{{ profile.department if profile else '' }}" placeholder="Labour Statistics" required></div></div><div class="input-row" style="margin-top:1rem"><div><label>Organization</label><input name="organization" value="{{ profile.organization if profile else '' }}" placeholder="MoSPI"></div><div><label>Work domain</label><input name="work_domain" value="{{ profile.work_domain if profile else '' }}" placeholder="Official Statistics"></div></div><div class="input-row" style="margin-top:1rem"><div><label>Experience (years)</label><input type="number" step="0.5" min="0" name="experience_years" value="{{ profile.experience_years if profile else 0 }}"></div><div><label>Education</label><input name="education" value="{{ profile.education if profile else '' }}" placeholder="M.Sc. Statistics"></div></div><div style="margin-top:1rem"><label>Current assignment</label><textarea name="current_assignment" rows="4" placeholder="Describe your current responsibilities...">{{ profile.current_assignment if profile else '' }}</textarea></div><div style="margin-top:1rem"><label>Learning goal</label><textarea name="learning_goal" rows="3" placeholder="What skills do you want to improve?">{{ profile.learning_goal if profile else '' }}</textarea></div><div style="margin-top:1rem"><label>Preferred language</label><select name="preferred_language"><option {% if not profile or profile.preferred_language=='English' %}selected{% endif %}>English</option><option {% if profile and profile.preferred_language=='Hindi' %}selected{% endif %}>Hindi</option><option {% if profile and profile.preferred_language=='Hinglish' %}selected{% endif %}>Hinglish</option></select></div><button class="btn-primary" style="margin-top:1.5rem" type="submit">Save Profile →</button></form></div>{% endblock %}
